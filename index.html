    <!-- Structured Data: WebApplication & Organization & FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vibesift.pixir.in/#organization",
          "name": "Pixir",
          "url": "https://vibesift.pixir.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://vibesift.pixir.in/shield-check.svg"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "audit@pixir.in",
            "contactType": "customer service"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://vibesift.pixir.in/#webapp",
          "name": "VibeSift",
          "url": "https://vibesift.pixir.in",
          "applicationCategory": "DeveloperApplication",
          "operatingSystem": "All modern web browsers",
          "description": "Pre-launch website auditor inspecting Core Web Vitals, technical SEO crawlability, WCAG accessibility, and defensive security header configurations.",
          "publisher": {
            "@id": "https://vibesift.pixir.in/#organization"
          },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "description": "Free baseline launch-readiness website audits"
          },
          "featureList": [
            "Non-destructive passive website audit",
            "Core Web Vitals & Lighthouse edge performance analysis",
            "Defensive HTTP security headers and SSL configuration validation",
            "Technical SEO meta tags, canonical, robots.txt, and sitemap detection",
            "WCAG 2.1 automated accessibility compliance indicators",
            "Instant downloadable PDF audit summary reports"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://vibesift.pixir.in/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is checked in a free baseline scan?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A free baseline scan performs safe, non-destructive external inspections against the public URL. This includes technical SEO crawlability (title tags, meta descriptions, canonical links, robots.txt, sitemaps), Core Web Vitals and Lighthouse performance metrics, automated WCAG accessibility indicators, TLS/HTTPS configuration, HTTP security response headers (CSP, HSTS, X-Frame-Options), cookie security flags, and checks for commonly exposed sensitive files."
              }
            },
            {
              "@type": "Question",
              "name": "Does the scanner modify or disrupt websites?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. All baseline scans use strictly passive HTTP requests, standard browser rendering (via headless Chromium for Lighthouse), and polite request rates. The scanner never modifies your database, alters your pages, submits destructive forms, or consumes abnormal bandwidth."
              }
            },
            {
              "@type": "Question",
              "name": "Are the audit results a legal compliance certification?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. The audit report provides technical findings, observable indicators, and best-practice guidance, not formal legal certification or legal advice. Having a cookie banner, privacy policy link, or robots.txt file alone does not guarantee compliance with GDPR, CCPA, or regional data protection laws (such as India's DPDP Act)."
              }
            },
            {
              "@type": "Question",
              "name": "How are audit reports stored and handled?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Scans run by signed-in users are securely stored in your private account history in Amazon DynamoDB and encrypted Amazon S3 buckets with strict least-privilege IAM policies. Sensitive values are automatically redacted in report summaries. You can delete individual reports or your entire scan history at any time from your account settings."
              }
            }
          ]
        }
      ]
    }
    </script>
